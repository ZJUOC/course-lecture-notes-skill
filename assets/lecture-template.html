gap:12px;align-items:center;margin-bottom:36px;font-size:13px;color:var(--muted)}.utility button{border:0;background:none;color:#526071;padding:7px 9px}.utility button:hover{background:#f0f2f6}.kicker{font-size:12px;color:var(--purple);letter-spacing:1.7px;font-weight:700;margin-bottom:12px}h1{font-family:var(--serif);font-size:42px;line-height:1.3;letter-spacing:1px;margin:0 0 18px}h2{font-size:27px;line-height:1.45;margin:68px 0 24px;padding:22px 0 0;border-top:1px solid #d4dae4;font-weight:700}h3{font-size:21px;line-height:1.6;margin:36px 0 18px}p{margin:1em 0}strong{font-weight:650}.legend{display:flex;flex-wrap:wrap;gap:7px 20px;margin:26px 0 32px;padding:15px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px;color:#53606e}.legend span::before{content:"";display:inline-block;width:5px;height:13px;background:var(--tone);margin-right:7px;vertical-align:-2px}.definition{--tone:var(--green);--wash:#edf7f2;--edge:#cbe5d8}.theorem{--tone:var(--purple);--wash:#f0ecf7;--edge:#d8cce9}.result,.question{--tone:var(--blue);--wash:#eef7fb;--edge:#cce3ef}.example{--tone:var(--orange);--wash:#fcf2e9;--edge:#ead5c3}.warning{--tone:var(--rose);--wash:#fcf0f2;--edge:#efd1d7}.block{margin:26px 0;padding:17px 23px 19px;background:var(--wash);border:1px solid var(--edge);border-left:4px solid var(--tone);border-radius:0}.block-title{color:var(--tone);font-size:15px;font-weight:700;margin-bottom:9px}.block>:last-child{margin-bottom:0}.block p:first-of-type{margin-top:0}.block p{margin:.7em 0}.block .display.math{margin:12px 0;padding:8px 0}.display.math{display:block;max-width:100%;overflow-x:auto;overflow-y:hidden;margin:22px 0;padding:12px 4px;scrollbar-width:thin}math{font-family:math}math[display="block"]{font-size:1.09em;margin:auto;width:max-content;min-width:100%;max-width:none}table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.75;margin:24px 0}th,td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line); const details=[...document.querySelectorAll('details')],toggle=document.querySelector('#toggle');toggle.onclick=()=>{const expand=details.some(d=>!d.open);details.forEach(d=>d.open=expand);toggle.textContent=expand?'收起答案与拓展':'展开答案与拓展'};document.querySelector('#print').onclick=()=>window.print();let printState=[];window.addEventListener('beforeprint',()=>{printState=details.map(d=>d.open);details.forEach(d=>d.open=true)});window.addEventListener('afterprint',()=>details.forEach((d,i)=>d.open=printState[i]));const toc=document.querySelector('#toc-button');function showToc(open){document.body.classList.toggle('toc-open',open);toc.setAttribute('aria-expanded',String(open))}toc.onclick=()=>showToc(!document.body.classList.contains('toc-open'));document.querySelector('.scrim').onclick=()=>showToc(false);document.querySelectorAll('nav a').forEach(a=>a.addEventListener('click',()=>showToc(false)));const modal=document.querySelector('dialog');document.querySelectorAll('.figure-open').forEach(b=>b.onclick=()=>{const im=b.querySelector('img');modal.querySelector('img').src=im.src;modal.querySelector('img').alt=im.alt;modal.querySelector('p').textContent=b.closest('figure').querySelector('figcaption').textContent;modal.showModal()});modal.querySelector('.close').onclick=()=>modal.close();modal.onclick=e=>{if(e.target===modal)modal.close()};const headings=[...document.querySelectorAll('main h2')];const links=[...document.querySelectorAll('nav a')];function markChapter(){let current=headings[0];for(const h of headings){if(h.getBoundingClientRect().top<Math.max(180,innerHeight*.35))current=h;else break}links.forEach(a=>a.classList.toggle('active',decodeURIComponent(a.hash.slice(1))===current.id))}window.addEventListener('scroll',markChapter,{passive:true});markChapter();
</script></body></html>
